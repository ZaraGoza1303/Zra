services:
  redis:
    image: redis:7-alpine
    container_name: chatapp-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - chatapp-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatapp-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chatapp-net

volumes:
  redis_data:

networks:
  chatapp-net:
    driver: bridge
